<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Nocturnal Moonlight Sonata sky gradient -->
    <linearGradient id="nightSky" x1="0.15" y1="0.0" x2="0.85" y2="1.0">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="48%" stop-color="#111A3A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Rim glow -->
    <linearGradient id="moonRim" x1="0.8" y1="0.05" x2="0.2" y2="0.95">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.78"/>
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.24"/>
    </linearGradient>

    <!-- Luminous full moon core -->
    <radialGradient id="moonCore" cx="0.38" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="58%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </radialGradient>

    <!-- Multi-ring lunar halo -->
    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Water reflection shimmer -->
    <linearGradient id="waterGlow" x1="0.5" y1="0.0" x2="0.5" y2="1.0">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Sonata note & soundwave emblem -->
    <linearGradient id="noteEmblem" x1="0.2" y1="0.0" x2="0.85" y2="1.0">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="35%" stop-color="#E0E7FF"/>
      <stop offset="72%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Piano wave silhouette gradient -->
    <linearGradient id="pianoWave" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090D1E" stop-opacity="0.98"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="12" y="12" width="232" height="232" rx="56"/>
    </clipPath>
  </defs>

  <!-- Outer rounded squircle -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#nightSky)"/>

  <g clip-path="url(#squircleClip)">
    <!-- Ambient moon aura rings in upper-right sky -->
    <circle cx="176" cy="76" r="88" fill="url(#moonHalo)"/>
    <circle cx="176" cy="76" r="56" fill="#A5B4FC" fill-opacity="0.10"/>
    <circle cx="176" cy="76" r="40" fill="#E0E7FF" fill-opacity="0.16"/>

    <!-- Starlight flecks -->
    <circle cx="52" cy="54" r="1.6" fill="#FDFBF7" fill-opacity="0.85"/>
    <circle cx="84" cy="40" r="1.2" fill="#E0E7FF" fill-opacity="0.65"/>
    <circle cx="118" cy="58" r="1.4" fill="#C7D2FE" fill-opacity="0.70"/>
    <circle cx="44" cy="96" r="1.1" fill="#E0E7FF" fill-opacity="0.50"/>
    <circle cx="68" cy="78" r="1.8" fill="#FDFBF7" fill-opacity="0.75"/>
    <circle cx="214" cy="122" r="1.3" fill="#E0E7FF" fill-opacity="0.60"/>

    <!-- Luminous Moon (Op. 27 No. 2) -->
    <circle cx="176" cy="76" r="26" fill="url(#moonCore)"/>
    <!-- Subtle crescent shadow & crater texture -->
    <path d="M166 52 A26 26 0 1 0 196 92 A22 22 0 1 1 166 52 Z" fill="#A5B4FC" fill-opacity="0.28"/>

    <!-- Nocturnal lake horizon & dark water basin -->
    <path d="M12 174 Q78 164 142 173 T244 170 L244 244 L12 244 Z" fill="url(#pianoWave)"/>

    <!-- Shimmering moonlight reflections on water -->
    <rect x="150" y="176" width="52" height="3.2" rx="1.6" fill="url(#waterGlow)"/>
    <rect x="156" y="185" width="40" height="2.8" rx="1.4" fill="url(#waterGlow)"/>
    <rect x="144" y="194" width="58" height="2.5" rx="1.25" fill="url(#waterGlow)"/>
    <rect x="160" y="203" width="34" height="2.2" rx="1.1" fill="url(#waterGlow)"/>
    <rect x="152" y="212" width="44" height="2.0" rx="1.0" fill="url(#waterGlow)"/>
    <rect x="165" y="221" width="24" height="1.8" rx="0.9" fill="url(#waterGlow)"/>

    <!-- Flowing arpeggio soundwave / curved grand-piano silhouette -->
    <path d="M16 196 C54 166, 92 162, 132 182 C168 200, 206 198, 244 176"
          fill="none" stroke="#818CF8" stroke-width="2.5" stroke-opacity="0.45" stroke-linecap="round"/>
    <path d="M16 210 C60 180, 102 176, 144 196 C178 212, 212 208, 244 190"
          fill="none" stroke="#C084FC" stroke-width="2.0" stroke-opacity="0.35" stroke-linecap="round"/>

    <!-- Subtle stylized piano key motifs along the lower-left curve -->
    <g fill="#E0E7FF" fill-opacity="0.22">
      <rect x="36" y="184" width="7" height="24" rx="2" transform="rotate(-14 36 184)"/>
      <rect x="48" y="180" width="7" height="26" rx="2" transform="rotate(-10 48 180)"/>
      <rect x="60" y="177" width="7" height="28" rx="2" transform="rotate(-6 60 177)"/>
      <rect x="72" y="176" width="7" height="28" rx="2" transform="rotate(-2 72 176)"/>
      <rect x="84" y="177" width="7" height="26" rx="2" transform="rotate(2 84 177)"/>
    </g>

    <!-- Glowing Sonata eighth-note & lyrical ribbon emblem in foreground -->
    <!-- Outer soft glow behind note -->
    <ellipse cx="96" cy="156" rx="26" ry="20" transform="rotate(-20 96 156)" fill="#818CF8" fill-opacity="0.26"/>
    <!-- Note head -->
    <ellipse cx="96" cy="156" rx="21" ry="15.5" transform="rotate(-20 96 156)" fill="url(#noteEmblem)"/>
    <ellipse cx="94" cy="154" rx="10" ry="6.5" transform="rotate(-20 94 154)" fill="#0F172A" fill-opacity="0.22"/>
    <!-- Note stem -->
    <rect x="108" y="64" width="11" height="92" rx="5.5" fill="url(#noteEmblem)"/>
    <!-- Flowing dual-voice flag sweeping toward the moon -->
    <path d="M114 64 C136 62, 160 76, 166 102 C154 88, 136 82, 118 84 Z" fill="url(#noteEmblem)"/>
    <path d="M114 88 C132 87, 150 98, 154 118 C144 107, 130 102, 118 103 Z" fill="#C084FC" fill-opacity="0.78"/>
  </g>

  <!-- Inner moonlight squircle border -->
  <rect x="12" y="12" width="232" height="232" rx="56"
        fill="none" stroke="url(#moonRim)" stroke-width="4.5"/>
</svg>
