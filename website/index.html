<!doctype html>
<html lang="en" class="dark" data-type="software">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <title>Sonata: Cross-Platform Rust Music Player for Android, Desktop &amp; Terminal</title>
    <meta
      name="description"
      content="Sonata is an open-source, local-first music player written in Rust for Android, Linux, macOS, Windows, and Terminal. Up to 321 kbps Opus, 9-source synced lyrics, and zero telemetry."
    />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:title" content="Sonata: Cross-Platform Rust Music Player" />
    <meta
      property="og:description"
      content="Open-source Rust music player for Android, Desktop, and Terminal with Hi-Fi Opus/AAC streams, 9-source synced lyrics, and self-hosted library support."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sonata: Cross-Platform Rust Music Player" />
    <meta
      name="twitter:description"
      content="Open-source Rust music player for Android, Desktop, and Terminal with zero trackers."
    />
    <meta name="twitter:image" content="./og-image.jpg" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("sonata-site-theme");
          var root = document.documentElement;
          if (saved === "light") {
            root.classList.remove("dark");
            root.classList.add("light");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#f5f5f7");
          } else {
            root.classList.remove("light");
            root.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
