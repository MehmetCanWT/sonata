[package]
name = "sonata"
version = "0.1.0"
edition = "2021"
description = "Fast, modular terminal music player for YouTube Music and Spotify with HD album art, synced lyrics, Hi-Fi audio enhancer, and color-only themes"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
cipher = { version = "0.4", features = ["block-padding"] }
crossterm = "0.29"
des = "0.8"
dirs = "6"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.30"
ratatui-image = { version = "10.0", default-features = false, features = ["crossterm", "image-defaults"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
urlencoding = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
