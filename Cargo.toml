[workspace]
resolver = "2"
members = [
    "crates/sonata-core",
    "crates/sonata-tui",
    "crates/sonata-desktop",
    "crates/sonata-android",
]
default-members = ["crates/sonata-tui", "crates/sonata-desktop"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MehmetCanWT/sonata"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
cosmic-text = "0.19"
crossterm = "0.29"
dirs = "6"
flate2 = "1"
gpui-kit = "0.10.0"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ksni = "0.3.7"
libc = "0.2"
mpris-server = { version = "0.11.0", features = ["tokio"] }
ratatui = "0.30"
ratatui-image = { version = "10.0", default-features = false, features = ["crossterm", "image-defaults"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip"] }
roxmltree = "0.21"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = false
codegen-units = 16
incremental = true
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.cosmic-text]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3
