[workspace]
resolver = "2"
members = [
    "crates/sonata-core",
    "crates/sonata-runtime",
    "crates/sonata-tui",
    "crates/sonata-desktop",
    "crates/sonata-android",
]
default-members = ["crates/sonata-tui", "crates/sonata-desktop"]

[workspace.package]
version = "1.0.10"
edition = "2021"
license = "MIT"
repository = "https://github.com/MehmetCanWT/sonata"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
dirs = "6"
flate2 = "1"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
ksni = "0.3.7"
mpris-server = { version = "0.11.0", features = ["tokio"] }
ratatui = "0.30"
ratatui-image = { version = "10.0", default-features = false, features = ["crossterm", "image-defaults"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip"] }
roxmltree = "0.21"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
souvlaki = "0.9"
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package.image]
opt-level = 3
