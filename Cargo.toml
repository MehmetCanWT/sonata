[workspace]
resolver = "2"
members = [
    "crates/sonata-core",
    "crates/sonata-tui",
    "crates/sonata-desktop",
    "crates/sonata-android",
]
default-members = ["crates/sonata-tui", "crates/sonata-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MehmetCanWT/sonata"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
dirs = "6"
gpui-kit = "0.10.0"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ksni = "0.3.7"
libc = "0.2"
mpris-server = { version = "0.11.0", features = ["tokio"] }
ratatui = "0.30"
ratatui-image = { version = "10.0", default-features = false, features = ["crossterm", "image-defaults"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 8
strip = true
opt-level = 3
