name: Release Builds

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute semantic version and Android versionCode
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          fi
          CORE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CORE}"
          MAJOR="${MAJOR:-1}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          VERSION_CODE="$(( MAJOR * 10000 + MINOR * 100 + PATCH ))"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved Sonata v${VERSION} (Android versionCode=${VERSION_CODE})"

  appimage:
    name: Linux Desktop AppImage (x86_64)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            fuse \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked -p sonata-desktop -p sonata-tui

      - name: Assemble Sonata.AppDir
        run: |
          mkdir -p Sonata.AppDir/usr/bin \
                   Sonata.AppDir/usr/share/applications \
                   Sonata.AppDir/usr/share/icons/hicolor/scalable/apps

          cp target/release/sonata-desktop Sonata.AppDir/usr/bin/sonata-desktop
          cp target/release/sonata Sonata.AppDir/usr/bin/sonata
          chmod +x Sonata.AppDir/usr/bin/sonata-desktop Sonata.AppDir/usr/bin/sonata

          cat <<'EOF' > Sonata.AppDir/AppRun
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export PATH="$HERE/usr/bin:$PATH"
          if [[ "${1:-}" == "--tui" ]]; then
            shift
            exec "$HERE/usr/bin/sonata" "$@"
          fi
          exec "$HERE/usr/bin/sonata-desktop" "$@"
          EOF
          chmod +x Sonata.AppDir/AppRun

          cat <<'EOF' > Sonata.AppDir/sonata.desktop
          [Desktop Entry]
          Type=Application
          Name=Sonata
          Comment=High-fidelity native music player for YouTube Music and Spotify
          Exec=sonata-desktop
          Icon=sonata
          Categories=AudioVideo;Audio;Music;Player;
          Terminal=false
          StartupWMClass=sonata-desktop
          EOF
          cp Sonata.AppDir/sonata.desktop Sonata.AppDir/usr/share/applications/sonata.desktop

          cp assets/sonata-logo.svg Sonata.AppDir/sonata.svg
          cp assets/sonata-logo.svg Sonata.AppDir/.DirIcon
          cp assets/sonata-logo.svg Sonata.AppDir/usr/share/icons/hicolor/scalable/apps/sonata.svg

      - name: Build AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          curl -fsSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          OUT="Sonata-v${VERSION}-x86_64.AppImage"
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run Sonata.AppDir "${OUT}"
          chmod +x "${OUT}"
          ls -lh "${OUT}"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-Linux-AppImage
          path: Sonata-v*-x86_64.AppImage
          if-no-files-found: error

  android-apk:
    name: Android APK (arm64-v8a)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27.2.12479018
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Rust & Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust UniFFI shared library
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build -p sonata-android --release --locked

      - name: Prepare optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/sonata-release.jks"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/sonata-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build installable Android APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PsonataVersion="${VERSION}" \
            -PsonataVersionCode="${VERSION_CODE}" \
            --console=plain
          cp app/build/outputs/apk/release/app-release.apk "../Sonata-v${VERSION}-arm64.apk"
          ls -lh "../Sonata-v${VERSION}-arm64.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-Android-APK
          path: Sonata-v*-arm64.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - version
      - appimage
      - android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: Sonata-Linux-AppImage
          path: release-artifacts

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Sonata-Android-APK
          path: release-artifacts

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum Sonata-v* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Sonata v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            release-artifacts/Sonata-v*-x86_64.AppImage
            release-artifacts/Sonata-v*-arm64.apk
            release-artifacts/SHA256SUMS.txt
