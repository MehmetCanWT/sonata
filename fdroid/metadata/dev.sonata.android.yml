AuthorName: MehmetCanWT
AuthorWebSite: https://github.com/MehmetCanWT

SourceCode: https://github.com/MehmetCanWT/sonata
IssueTracker: https://github.com/MehmetCanWT/sonata/issues
Changelog: https://github.com/MehmetCanWT/sonata/blob/HEAD/CHANGELOG.md

AutoName: Sonata

AntiFeatures:
  NonFreeNet:
    en-US: Streams audio and metadata from YouTube Music and optional third-party lyrics/audio services.

RepoType: git
Repo: https://github.com/MehmetCanWT/sonata.git

Builds:
  - versionName: 1.0.1
    versionCode: 10001
    commit: v1.0.1
    subdir: android/app
    gradle:
      - yes
    ndk: 27.2.12479018
    srclibs:
      - rustup@1.28.1
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk --locked
      - cd ../.. && cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build -p sonata-android --release --locked
    scandelete:
      - target

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.0.1
CurrentVersionCode: 10001
